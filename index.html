.bossTransition{position:fixed;z-index:40;left:50%;top:28%;width:min(580px,92vw);padding:25px 18px;text-align:center;pointer-events:none;opacity:0;transform:translate(-50%,-50%);color:#fff1c6;background:linear-gradient(90deg,transparent,#172c35f5 16%,#172c35f5 84%,transparent);border-block:1px solid #edcf7970;text-shadow:0 2px 8px #000;visibility:hidden}
